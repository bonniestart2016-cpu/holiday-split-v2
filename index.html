
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Holiday Split</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,
        #dbeafe, #f0fdf4);
      padding: 20px;
    }
    .card {
      background: white;
      padding: 45px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px #0002;
      text-align: center;
      width: 100%;
      max-width: 450px;
    }
    h1 { color: #1e3a8a; }
    p {
      color: #64748b;
      line-height: 1.6;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 32px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }
    .button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Holiday Split</h1>
    <p>Plan together. Split fairly.</p>
    <p>
      Keep track of shared holiday expenses
      and make splitting costs easier.
    </p>
    <a class="button"
       href="https://script.google.com/macros/s/AKfycbwHALZtfMjq2zgaC8xluUGGeD8zKLtXAoP1Hzhcpw5SbggkwzlMUCV1jxHVdM-cdPYO/exec"
       target="_blank"
       rel="noopener noreferrer">
       Open Holiday Split
    </a>
  </main>
</body>
</html>
